name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run SAST (Static Application Security Testing)
        run: npm audit --audit-level=moderate
      
      - name: Run SCA (Software Composition Analysis)
        run: npm audit --audit-level=moderate
      
      - name: Check for exposed secrets
        run: npm run security:check
      
      - name: Run ESLint security rules
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: security-scan
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authentic_reader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript compiler
        run: npm run type-check
      
      - name: Run backend tests
        run: npm run test:backend
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: authentic_reader_test
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          JWT_EXPIRES_IN: 1d
          NODE_ENV: test
      
      - name: Run frontend tests
        run: npm run test:frontend
      
      - name: Run test coverage
        run: npm run test:coverage

  accessibility:
    name: Accessibility Testing
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Run accessibility tests
        run: npx pa11y-ci dist/**/*.html
      
      - name: Run axe-core tests
        run: npm run test:accessibility

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, accessibility]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Build backend
        run: cd server && npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            dist/
            server/dist/ 