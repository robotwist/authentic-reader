name: Email edition

on:
  schedule:
    # Backup for the send at the end of each pipeline run. GitHub often starts
    # scheduled runs hours late; a day already sent is skipped.
    - cron: '25 11 * * *'
    - cron: '25 16 * * *'
  workflow_dispatch:
    inputs:
      preview_to:
        description: Send one preview copy to this address instead of the list
        required: false

concurrency:
  group: email-edition
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/send-email-edition.mjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          PREVIEW_TO: ${{ inputs.preview_to }}
