name: Site check

# Fails, and GitHub emails the repository owner, when the site is down (for
# example paused because Netlify credits ran out) or today's edition is missing.
on:
  schedule:
    - cron: '40 12 * * *'
    - cron: '40 22 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site and today's edition
        run: |
          site=https://authentic-reader.netlify.app
          page=$(curl -s -w '\n%{http_code}' "$site/")
          if [ "$(echo "$page" | tail -1)" != "200" ] || echo "$page" | grep -qi 'site not available'; then
            echo "::error::The site is not available. Check the Netlify usage page for credits."
            exit 1
          fi
          curl -sf "$site/api/daily-briefing" | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const day = JSON.parse(s);
              const today = new Date().toISOString().slice(0, 10);
              const stories = (day.order || []).length;
              console.log(`Edition ${day.briefingDate}: ${stories} stories`);
              if (day.briefingDate !== today) { console.log(`::error::No edition for ${today}; the latest is ${day.briefingDate}.`); process.exit(1); }
              if (stories < 3) { console.log(`::error::Only ${stories} stories published today.`); process.exit(1); }
            });'
