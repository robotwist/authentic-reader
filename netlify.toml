[build]
  # Install dependencies including devDependencies, then build
  # Using npm install instead of npm ci to avoid timeout issues
  command = "npm install --include=dev --prefer-offline --no-audit && npm run test:pipeline && npm run typecheck && npm run build"
  publish = "dist"
  
[build.environment]
  # Specify Node.js version explicitly
  NODE_VERSION = "20"
  # Skip Husky install during CI builds
  HUSKY = "0"
  
# Set environment variables for production
# The API is served by Netlify Functions (netlify/functions) on the same origin,
# so VITE_API_URL is intentionally left unset.
[context.production.environment]
  # Disable ChromaDB in production as it's not available
  VITE_ENABLE_CHROMA = "false"
  VITE_ENABLE_FEEDBACK_LOOP = "false"

# Handle SPA routing - only redirect when file doesn't exist
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false