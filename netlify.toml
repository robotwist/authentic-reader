[build]
  # Install dependencies including devDependencies, then build
  command = "npm ci --include=dev && npm run build:no-types"
  publish = "dist"
  
[build.environment]
  # Specify Node.js version explicitly
  NODE_VERSION = "20"
  # Skip Husky install during CI builds
  HUSKY = "0"
  
# Set environment variables for production
[context.production.environment]
  # Local backend URL (running on your machine)
  VITE_API_URL = "http://localhost:3000"
  VITE_BACKEND_URL = "http://localhost:3000"
  # Disable ChromaDB in production as it's not available
  VITE_ENABLE_CHROMA = "false"
  VITE_ENABLE_FEEDBACK_LOOP = "false"

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 