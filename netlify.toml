[build]
  # Install dependencies including devDependencies, then build
  # Using npm install instead of npm ci to avoid timeout issues
  command = "npm install --include=dev && npm run build"
  publish = "dist"
  
[build.environment]
  # Specify Node.js version explicitly
  NODE_VERSION = "20"
  # Skip Husky install during CI builds
  HUSKY = "0"
  # Optimize npm installation
  NPM_FLAGS = "--prefer-offline --no-audit"
  
# Set environment variables for production
[context.production.environment]
  # Use Heroku backend
  VITE_API_URL = "https://authentic-reader-backend-c7754cf50ab2.herokuapp.com"
  VITE_BACKEND_URL = "https://authentic-reader-backend-c7754cf50ab2.herokuapp.com"
  # Disable ChromaDB in production as it's not available
  VITE_ENABLE_CHROMA = "false"
  VITE_ENABLE_FEEDBACK_LOOP = "false"

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 